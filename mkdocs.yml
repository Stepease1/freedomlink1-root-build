site_name: Freedomlink1 Governance Portal
site_url: https://stepease1.github.io/freedomlink1-root-build/
docs_dir: .
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy
    - search.highlight
    - search.suggest
nav:
    - Home: docs/index.md

    - Institutional Suite:
            - Overview: docs/institution/overview.md
            - Compiled Suite: docs/institution/Freedomlink1_Institutional_Suite.md
      - Trust Charter: docs/institution/Trust_Charter.md
      - Grantor Declaration: docs/institution/Grantor_Declaration.md
      - Agency Charter: docs/institution/Agency_Charter.md
      - Treasury Governance: docs/institution/Treasury_Governance.md

    - Identity:
            - Sovereign Identity Charter: docs/identity/sovereign_identity_charter.md

    - Architecture:
            - Institutional Architecture Summary: docs/architecture/summary.md
            - Institutional Diagram: docs/architecture/diagram.md
            - Institutional Health Monitor: docs/architecture/health_monitor.md

    - Governance Proposals:
      - Proposal Index: docs/proposals/index.md
      - Submission Portal: docs/proposals/submission_portal.md
      - A‑001 Agency Charter: docs/proposals/Freedomlink1_Agency_Charter.md
      - B‑001 Treasury Governance: docs/proposals/Freedomlink1_Treasury_Governance.md

  - Governance:
      - Public Governance Index: docs/governance/index.md
      - Governance Dashboard: docs/governance/dashboard.md
      - Sovereign Continuity Doctrine: docs/governance/continuity_doctrine.md
      - Governance Review Cycle: docs/governance/review_cycle.md

  - Sovereign Codex:
      - Codex Binding: docs/codex/Codex_Binding_Institutional_Suite.md
      - Codex Bindings JSON: docs/codex/codex.bindings.json
      - Explorer: docs/codex/explorer.md

  - Lineage:
      - Epoch 5 Anchor: freedomlink1-governance/lineage/anchors/epoch_5_institutional_anchor.json
      - Epoch 5 Seal: freedomlink1-governance/lineage/seals/epoch_5_institutional_seal.json
      - Epoch 6 Initialization: docs/lineage/epoch_6_initialization.md
    - Epoch 6 Continuity Report: docs/lineage/epoch_6_continuity_report.md
      - Lineage Version: versioning/lineage.version
      - Explorer: docs/lineage/explorer.md

  - Epochs:
      - Timeline: docs/epochs/timeline.md

  - Unified Integration Layer:
      - PPTF Bindings: unified/pptf.bindings.json
      - Unified Version: versioning/unified.version

  - Unified Layer:
      - Explorer: docs/unified/explorer.md

  - PPTF Governance:
      - Governance: docs/pptf/governance.md

  - Hardware Root:
      - Rootstone‑I Identity: docs/rootstone/identity.md
