site_name: Freedomlink1 Root Build
site_description: Sovereign governance, protocol, and lineage documentation
site_url: https://stepease1.github.io/freedomlink1-root-build/
docs_dir: docs
exclude_docs: README.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Governance:
      - Overview: governance/index.md
      - Dashboard: governance/dashboard.md
      - Continuity Doctrine: governance/continuity_doctrine.md
      - Review Cycle: governance/review_cycle.md
  - Merkle Forest:
      - Overview: merkle/index.md
  - Specifications:
      - Overview: specifications/index.md
      - Unified Integration Layer: Unified_Integration_Layer.md
      - Institutional Architecture: architecture/summary.md
  - Institutional Suite:
      - Overview: institution/overview.md
      - Compiled Suite: institution/Freedomlink1_Institutional_Suite.md
      - Trust Charter: institution/Trust_Charter.md
      - Grantor Declaration: institution/Grantor_Declaration.md
      - Agency Charter: institution/Agency_Charter.md
      - Treasury Governance: institution/Treasury_Governance.md
  - Identity:
      - Sovereign Identity Charter: identity/sovereign_identity_charter.md
  - Architecture:
      - Summary: architecture/summary.md
      - Diagram: architecture/diagram.md
      - Health Monitor: architecture/health_monitor.md
      - Systems Overview: architecture/systems_overview.md
  - Governance Proposals:
      - Proposal Index: proposals/index.md
      - Submission Portal: proposals/submission_portal.md
      - Agency Charter: proposals/Freedomlink1_Agency_Charter.md
      - Treasury Governance: proposals/Freedomlink1_Treasury_Governance.md
  - Sovereign Codex:
      - Institutional Suite Binding: codex/Codex_Binding_Institutional_Suite.md
      - Editorial Integration: codex/Codex_Editorial_Integration.md
      - Explorer: codex/explorer.md
  - Lineage and Epochs:
      - Epoch 6 Initialization: lineage/epoch_6_initialization.md
      - Epoch 6 Continuity Report: lineage/epoch_6_continuity_report.md
      - Timeline: epochs/timeline.md
  - Rootstone-I:
      - Identity: rootstone/identity.md
  - Unified Layer:
      - Explorer: unified/explorer.md
      - Continuity Ceremony: unified_layer_continuity_ceremony.md
      - Institutional Codex: unified_layer_institutional_codex.md
      - Verification Codex: unified_layer_verification_codex.md
  - Whitepapers:
      - Freedomlink1 Whitepaper: freedomlink1/whitepaper.md
