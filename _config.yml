# FreedomLink1 Root Build - GitHub Pages Configuration

# Site settings
title: FreedomLink1 Root Build v1.0.0
description: Sovereign-grade governance, omni-domain constitutions, Merkle-rooted proofs, and public verification
baseurl: "/freedomlink1-root-build"
url: "https://github.com/Stepease1/freedomlink1-root-build"

# Build settings
theme: jekyll-default
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# Defaults
defaults:
  - scope:
      path: "docs"
    values:
      layout: "default"
      permalink: /:title

# GitHub Pages settings
# Build and deployment
include:
  - .nojekyll
  - CNAME

exclude:
  - .git
  - .gitignore
  - node_modules
  - vendor
  - .github
  - scripts
  - artifacts

# Collections
collections:
  governance:
    output: true
    permalink: /governance/:name
  lineage:
    output: true
    permalink: /lineage/:name
  docs:
    output: true
    permalink: /:name

# Navigation
header_pages:
  - README.md
  - PROCLAMATION.md
  - CONTRIBUTING.md
  - VERIFY.md
  - governance/failure_playbook.md
  - governance/root_build_recovery.md
  - ceremonies/key_rotation.md
  - ceremonies/module_retirement.md

# SEO and social settings
twitter:
  username: freedomlink1
facebook:
  app_id: 
  publisher: 
google_site_verification: 

# Analytics (optional)
google_analytics: 

# Comments (optional)
disqus:
  shortname: 

# Author information
author:
  name: FreedomLink1 Contributors
  email: 
  github: Stepease1

# License
license: MIT
license_url: /LICENSE

# Permalink style
permalink: /blog/:year/:month/:day/:title

# Paginate settings
paginate: 10
paginate_path: /page:num

# Keep files
keep_files:
  - CNAME
  - .gitignore

# Show drafts
show_drafts: false
future: false

# Timezone
timezone: UTC
