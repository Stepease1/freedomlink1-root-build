name: Freedomlink1 Governance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  governance-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Install Python deps
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install cryptography

    - name: Smoke Tests
      run: |
        if [ -x "./install/smoke_test.sh" ]; then
          bash ./install/smoke_test.sh
        elif [ -x "./tests/smoke_tests.sh" ]; then
          bash ./tests/smoke_tests.sh
        else
          echo "[Pipeline] No smoke test script found; skipping."
        fi

    - name: Canonicalize Artifacts
      run: |
        if [ -d artifacts ] && [ -f scripts/canonicalize_json.py ]; then
          python3 scripts/canonicalize_json.py artifacts/ canonical/
        else
          echo "[Pipeline] artifacts/ or scripts/canonicalize_json.py missing; skipping canonicalization."
        fi

    - name: Compute Hashes
      run: |
        if [ -d canonical ] && [ -f scripts/compute_hashes.py ]; then
          python3 scripts/compute_hashes.py canonical/ hash_manifest.json
        else
          echo "[Pipeline] canonical/ or compute_hashes.py missing; skipping hash computation."
        fi

    - name: Build Merkle Root
      run: |
        if [ -f hash_manifest.json ] && [ -f scripts/build_merkle_tree.py ]; then
          python3 scripts/build_merkle_tree.py hash_manifest.json merkle_root.txt
        else
          echo "[Pipeline] hash_manifest.json or build_merkle_tree.py missing; skipping merkle root build."
        fi

    - name: Verify Sovereign Signature
      run: |
        if [ -f merkle_root.txt ] && [ -f artifacts/omni-proof-master.json ] && [ -f scripts/verify_signature.py ]; then
          python3 scripts/verify_signature.py merkle_root.txt artifacts/omni-proof-master.json
        else
          echo "[Pipeline] merkle_root.txt or omni-proof-master.json or verify_signature.py missing; skipping signature verification."
        fi

    - name: Verify Lineage
      run: |
        if [ -d lineage ] && [ -f scripts/verify_lineage.py ]; then
          python3 scripts/verify_lineage.py lineage/
        else
          echo "[Pipeline] lineage/ or scripts/verify_lineage.py missing; skipping lineage verification."
        fi

    - name: Module Verification
      run: |
        if [ -f tools/module_verify_all.py ]; then
          python3 tools/module_verify_all.py
        else
          echo "[Pipeline] tools/module_verify_all.py missing; skipping module verification."
        fi

    - name: POC Verification
      run: |
        if [ -f tools/poc_verify_all.py ]; then
          python3 tools/poc_verify_all.py
        else
          echo "[Pipeline] tools/poc_verify_all.py missing; skipping POC verification."
        fi

    - name: Deploy (Internal Pilot Only)
      if: github.ref == 'refs/heads/main'
      run: |
        if [ -x install/deploy_internal.sh ]; then
          bash install/deploy_internal.sh
        else
          echo "[Pipeline] install/deploy_internal.sh missing; skipping deploy step."
        fi
