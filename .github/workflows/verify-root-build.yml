name: Verify Root Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install cryptography

    - name: Validate epoch ledger
      run: python scripts/validate_epoch_ledger.py

    - name: Verify lineage structure
      run: python scripts/verify_lineage.py lineage/

    - name: Run integrity monitor
      run: python scripts/integrity_monitor.py

    - name: Final status
      run: echo "✓ Root Build verification complete - Governance integrity enforced"

    - name: Upload verification report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: verification-report
        path: |
          hash_manifest.json
          merkle_root.txt
        retention-days: 30
